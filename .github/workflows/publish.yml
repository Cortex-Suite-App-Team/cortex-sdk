name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      EXPECTED_PACKAGE_NAME: "@cortex-suite/sdk"
      EXPECTED_REPOSITORY_URL: git+https://github.com/${{ github.repository }}.git
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate release bundle
        shell: bash
        run: |
          set -euo pipefail

          test -f LICENSE
          test -f js/package.json
          test -f js/README.md
          test -f js/dist/browser/index.js
          test -f js/dist/node/index.js
          test -f js/dist/types/index.d.ts
          ls python/dist/*.whl >/dev/null
          ls python/dist/*.tar.gz >/dev/null

          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] && [ "$REF_TYPE" = "tag" ]; then
            echo "::error::Release tag must look like vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi

          TAG_VERSION=""
          if [ "$REF_TYPE" = "tag" ]; then
            TAG_VERSION="${REF_NAME#v}"
          else
            mapfile -t HEAD_TAGS < <(git tag --points-at HEAD --list 'v*')
            if [ "${#HEAD_TAGS[@]}" -eq 0 ]; then
              echo "::error::workflow_dispatch must target a commit that already has a v* tag"
              exit 1
            fi
            if [ "${#HEAD_TAGS[@]}" -gt 1 ]; then
              echo "::error::workflow_dispatch found multiple v* tags on HEAD: ${HEAD_TAGS[*]}"
              exit 1
            fi
            TAG_VERSION="${HEAD_TAGS[0]#v}"
          fi

          JS_VERSION=$(node -p "require('./js/package.json').version")
          JS_NAME=$(node -p "require('./js/package.json').name")
          JS_REPOSITORY_URL=$(node -p "require('./js/package.json').repository.url")
          PY_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re

          wheel = next(Path("python/dist").glob("*.whl"))
          match = re.match(r".+?-([0-9][^-]*)-", wheel.name)
          if match is None:
              raise SystemExit(f"Could not parse Python version from {wheel.name}")
          print(match.group(1))
          PY
          )

          if [ "$JS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: js/package.json=$JS_VERSION python/dist=$PY_VERSION"
            exit 1
          fi

          if [ "$JS_NAME" != "$EXPECTED_PACKAGE_NAME" ]; then
            echo "::error::Unexpected package name: $JS_NAME"
            exit 1
          fi

          if [ "$JS_REPOSITORY_URL" != "$EXPECTED_REPOSITORY_URL" ]; then
            echo "::error::repository.url mismatch: $JS_REPOSITORY_URL"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$JS_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match package version $JS_VERSION"
            exit 1
          fi

      - name: Validate npm package contents
        working-directory: js
        shell: bash
        run: npm pack --dry-run

  publish-pypi:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Publish Python package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publish-npm:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish JS package to npm
        working-directory: js
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --access public --provenance --ignore-scripts
